name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # macOS builds run on macOS 11 (Big Sur) and later.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - run: cargo build --release
      - run: cargo test --release
      # Sharing from Linux reads keyboards and mice from the kernel: check that
      # with a virtual keyboard+mouse (no desktop needed).
      - name: Linux sharing self-test
        if: runner.os == 'Linux'
        run: |
          # The runner needs the uinput module for the virtual test keyboard+mouse.
          if sudo modprobe uinput || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe uinput; }; then
            sudo ./target/release/edgehop --self-test --sharing-only
          elif [ "$(uname -m)" = x86_64 ]; then
            echo "no uinput module"; exit 1
          else
            echo "::warning::no uinput module on this $(uname -m) runner; sharing self-test skipped"
          fi
      # The installer builds, installs everything it should, and uninstalls cleanly.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1
          ./packaging/windows/test-installer.ps1
      # The .deb and .rpm build, and the .rpm installs and runs on real Fedora.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          ./target/release/edgehop --write-icon packaging/linux/edgehop.png
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb --no-build
          cargo generate-rpm
          dpkg-deb -c target/debian/*.deb
          docker run --rm -v "$PWD/target/generate-rpm:/pkg" fedora:latest bash -c '
            set -e
            dnf install -y /pkg/*.rpm
            rpm -ql edgehop
            ls -l /usr/lib/udev/rules.d/*edgehop* /usr/lib/modules-load.d/edgehop-uinput.conf
            edgehop --write-icon /tmp/icon.png && test -s /tmp/icon.png
            echo "edgehop installs and runs on $(. /etc/os-release; echo $PRETTY_NAME)"'
      # Nobody on the team has a Mac, so a real one checks the app instead:
      # launch, clipboard, pointer and keyboard (see packaging/macos/smoke-test.sh).
      - name: macOS app smoke test
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/build-app.sh
          bash packaging/macos/smoke-test.sh
      - name: Upload macOS screenshots and logs
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos
          path: smoke/
