name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build Edgehop
# for Windows, Linux and macOS and publish a GitHub Release with the downloads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # macOS builds run on macOS 11 (Big Sur) and later.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$TAG" ] || { echo "Tag $TAG doesn't match Cargo.toml version $v"; exit 1; }
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/Edgehop"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/edgehop.exe, packaging/windows/install.ps1, packaging/windows/uninstall.ps1, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "dist/Edgehop-$env:TAG-windows-x64.zip"
          Copy-Item target/release/edgehop.exe "dist/edgehop-$env:TAG-windows-x64.exe"
      - name: Installer
        if: hashFiles('packaging/windows/edgehop.iss') != ''
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1
          $env:UPDATE_TEST_OPTIONAL = '1'
          ./packaging/windows/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.exe

  linux:
    # Older glibc: the binary also runs on newer distributions.
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64, deb_arch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64, deb_arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      DEB_ARCH: ${{ matrix.deb_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - run: cargo test --release
      - run: cargo build --release
      - name: Sharing self-test (virtual keyboard + mouse)
        if: hashFiles('src/server_linux.rs') != ''
        run: |
          # The runner needs the uinput module for the virtual test keyboard+mouse.
          if sudo modprobe uinput || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe uinput; }; then
            sudo ./target/release/edgehop --self-test --sharing-only
          elif [ "$(uname -m)" = x86_64 ]; then
            echo "no uinput module"; exit 1
          else
            echo "::warning::no uinput module on this $(uname -m) runner; sharing self-test skipped"
          fi
      - name: Package (.deb, .rpm and tarball)
        run: |
          ./target/release/edgehop --write-icon packaging/linux/edgehop.png
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb "dist/edgehop_${TAG#v}_${DEB_ARCH}.deb"
          if grep -q generate-rpm Cargo.toml; then
            cargo generate-rpm
            cp target/generate-rpm/*.rpm "dist/edgehop-${TAG#v}-1.${ARCH}.rpm"
          fi
          name="edgehop-$TAG-linux-$ARCH"
          mkdir -p "$name"
          cp target/release/edgehop packaging/linux/60-edgehop-uinput.rules packaging/linux/70-edgehop-input.rules packaging/linux/edgehop-uinput.conf packaging/linux/edgehop-login.service \
             packaging/linux/edgehop.desktop packaging/linux/edgehop.png README.md "$name/"
          [ -f packaging/linux/install.sh ] && install -m755 packaging/linux/install.sh "$name/"
          tar czf "dist/$name.tar.gz" "$name"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - name: Build a universal Edgehop.app
        run: UNIVERSAL=1 bash packaging/macos/build-app.sh
      - name: Smoke test the app (launch, clipboard, pointer, keyboard)
        run: |
          if [ -f packaging/macos/smoke-test.sh ]; then UPDATE_TEST_OPTIONAL=1 bash packaging/macos/smoke-test.sh; fi
      - name: Upload macOS screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos
          path: smoke/
          if-no-files-found: ignore
      - name: Package
        run: |
          mkdir -p upload
          ditto -c -k --keepParent dist/Edgehop.app "upload/Edgehop-$TAG-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: upload/*.zip

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: release-*
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Edgehop $TAG" > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads
          - **Windows**: `Edgehop-Setup-….exe`. Run it: Start menu and desktop icons, starts in the tray when you sign in, uninstall from Apps & Features. (Or the `.zip`, or the bare `.exe`.)
          - **Ubuntu / Debian**: `edgehop_…_amd64.deb` (`arm64` for ARM). `sudo apt install ./edgehop_*.deb`, then log out and back in once.
          - **Fedora**: `edgehop-…x86_64.rpm` (`aarch64` for ARM, e.g. Asahi). `sudo dnf install ./edgehop-*.rpm`, then log out and back in once.
          - **Other Linux**: the `.tar.gz` for your CPU. Unpack it and run `./install.sh`.
          - **macOS**: unzip `Edgehop.app` into Applications, then allow it under *Privacy & Security → Accessibility*.

          The builds aren't code-signed yet, so Windows SmartScreen and macOS Gatekeeper will ask before the first launch.
          EOF
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" assets/* --title "Edgehop ${TAG#v}" --notes-file notes.md
          fi
