[package]
name = "edgehop"
version = "0.5.0"
edition = "2021"
description = "Share one keyboard and mouse across every computer on your network"
license = "MIT"
authors = ["edgehop"]

[dependencies]
eframe = "0.31"
snow = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
directories = "5"
gethostname = "0.5"
log = "0.4"
base64 = "0.22"
png = "0.17"

[build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
dbus = "0.9"
dbus-crossroads = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# `cargo deb` (https://github.com/kornelski/cargo-deb) builds the Ubuntu package.
[package.metadata.deb]
maintainer = "edgehop"
section = "utils"
priority = "optional"
depends = "$auto, libdbus-1-3"
recommends = "wl-clipboard, xclip, x11-xserver-utils, libnotify-bin"
extended-description = "Synergy-style software KVM: move your mouse off the edge of one screen and onto another computer."
maintainer-scripts = "packaging/linux/debian"
assets = [
    ["target/release/edgehop", "usr/bin/", "755"],
    ["packaging/linux/edgehop.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/edgehop.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/linux/60-edgehop-uinput.rules", "lib/udev/rules.d/", "644"],
    ["packaging/linux/70-edgehop-input.rules", "lib/udev/rules.d/", "644"],
    ["packaging/linux/edgehop-uinput.conf", "usr/lib/modules-load.d/", "644"],
    ["packaging/linux/edgehop-login.service", "lib/systemd/system/", "644"],
]

# Fedora / RHEL / openSUSE: `cargo generate-rpm` (after `cargo build --release`).
[package.metadata.generate-rpm]
summary = "Share one keyboard and mouse across every computer on your network"
assets = [
    { source = "target/release/edgehop", dest = "/usr/bin/edgehop", mode = "755" },
    { source = "packaging/linux/edgehop.desktop", dest = "/usr/share/applications/edgehop.desktop", mode = "644" },
    { source = "packaging/linux/edgehop.png", dest = "/usr/share/icons/hicolor/256x256/apps/edgehop.png", mode = "644" },
    { source = "packaging/linux/60-edgehop-uinput.rules", dest = "/usr/lib/udev/rules.d/60-edgehop-uinput.rules", mode = "644" },
    { source = "packaging/linux/70-edgehop-input.rules", dest = "/usr/lib/udev/rules.d/70-edgehop-input.rules", mode = "644" },
    { source = "packaging/linux/edgehop-uinput.conf", dest = "/usr/lib/modules-load.d/edgehop-uinput.conf", mode = "644" },
    { source = "packaging/linux/edgehop-login.service", dest = "/usr/lib/systemd/system/edgehop-login.service", mode = "644" },
]
post_install_script = """
modprobe uinput 2>/dev/null || true
udevadm control --reload-rules 2>/dev/null || true
udevadm trigger --name-match=uinput 2>/dev/null || true
udevadm trigger --subsystem-match=input 2>/dev/null || true
gtk-update-icon-cache -q /usr/share/icons/hicolor 2>/dev/null || true
systemctl daemon-reload 2>/dev/null || true
systemctl try-restart edgehop-login.service 2>/dev/null || true
"""

[package.metadata.generate-rpm.recommends]
wl-clipboard = "*"
xclip = "*"
