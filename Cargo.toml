[package]
name = "kvmlink"
version = "0.1.0"
edition = "2021"
description = "Share one keyboard and mouse across every computer on your network"
license = "MIT"
authors = ["kvmlink"]

[dependencies]
eframe = "0.31"
snow = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
directories = "5"
gethostname = "0.5"
log = "0.4"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
dbus = "0.9"
dbus-crossroads = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# `cargo deb` (https://github.com/kornelski/cargo-deb) builds the Ubuntu package.
[package.metadata.deb]
maintainer = "kvmlink"
section = "utils"
priority = "optional"
depends = "$auto, libdbus-1-3"
recommends = "wl-clipboard, xclip, x11-xserver-utils, libnotify-bin"
extended-description = "Synergy-style software KVM: move your mouse off the edge of one screen and onto another computer."
maintainer-scripts = "packaging/linux/debian"
assets = [
    ["target/release/kvmlink", "usr/bin/", "755"],
    ["packaging/linux/kvmlink.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/kvmlink.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/linux/60-kvmlink-uinput.rules", "lib/udev/rules.d/", "644"],
    ["packaging/linux/kvmlink-uinput.conf", "usr/lib/modules-load.d/", "644"],
]
